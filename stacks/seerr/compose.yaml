services:
  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    init: true
    user: ${PUID}:${PGID}
    restart: ${RESTART_POLICY}
    environment:
      - TZ=${TZ}
      - LOG_LEVEL=${LOG_LEVEL}
    volumes:
      - ${CONFIG_PATH}/seerr:/app/config
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/settings/public || exit 1" ]
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    networks:
      - proxy_net

networks:
  proxy_net:
    external: true
