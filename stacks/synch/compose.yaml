services:
  synch:
    build:
      context: https://github.com/hjinco/synch.git#main
      dockerfile: apps/api/Dockerfile
    image: synch-api:local
    container_name: synch
    restart: ${RESTART_POLICY}
    environment:
      - PUBLIC_URL=${PUBLIC_URL}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - SYNC_TOKEN_SECRET=${SYNC_TOKEN_SECRET}
      - AUTH_ALLOWED_EMAILS=${AUTH_ALLOWED_EMAILS}
      - PORT=8787
      - TZ=${TZ}
    volumes:
      - ${DATA_PATH}/synch:/app/data
    healthcheck:
      test: [ "CMD", "node", "-e", "fetch('http://localhost:8787/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - proxy_net

networks:
  proxy_net:
    external: true
