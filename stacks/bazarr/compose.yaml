services:
  bazarr:
    image: lscr.io/linuxserver/bazarr:${BAZARR_TAG:-latest}
    container_name: bazarr
    restart: ${RESTART_POLICY:-unless-stopped}
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: ${BAZARR_MEM_LIMIT:-1G}
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - UMASK=${UMASK:-002}
      - TZ=${TZ:-UTC}
    volumes:
      - ${CONFIG_PATH}/bazarr:/config
      - ${DATA_PATH}/radarr/movies:/movies
      - ${DATA_PATH}/sonarr/tvseries:/tv
      - ${DATA_PATH}/decypharr/mnt:/mnt:rslave
    healthcheck:
      test: ["CMD-SHELL", "curl -fsSL http://127.0.0.1:6767/ >/dev/null || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - proxy_net

networks:
  proxy_net:
    external: true
