services:
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:${PROWLARR_TAG:-latest}
    container_name: prowlarr
    restart: ${RESTART_POLICY:-unless-stopped}
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: ${PROWLARR_MEM_LIMIT:-512M}
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - UMASK=${UMASK:-002}
      - TZ=${TZ:-UTC}
      # Prevents .NET glibc arena memory bloat on Linux/ARM64:
      - MALLOC_TRIM_THRESHOLD_=131072
    volumes:
      - ${CONFIG_PATH}/prowlarr:/config
    healthcheck:
      test: ["CMD-SHELL", "curl -fsSL http://127.0.0.1:9696/ping >/dev/null || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - proxy_net

networks:
  proxy_net:
    external: true
