services:
  stirling-pdf:
    image: ghcr.io/stirling-tools/stirling-pdf:${STIRLING_TAG:-latest}
    container_name: stirling-pdf
    init: true
    restart: ${RESTART_POLICY}
    deploy:
      resources:
        limits:
          memory: ${STIRLING_MEM_LIMIT:-1536M}
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - SECURITY_ENABLELOGIN=${SECURITY_ENABLELOGIN:-true}
      - SYSTEM_DEFAULTLOCALE=${SYSTEM_DEFAULTLOCALE:-pl-PL}
      - JAVA_TOOL_OPTIONS=-Xmx768m -XX:+UseG1GC -XX:MaxGCPauseMillis=200
    volumes:
      - ${CONFIG_PATH}/stirling-pdf:/configs
      - ${DATA_PATH}/stirling-pdf/tessdata:/usr/share/tessdata
      - ${DATA_PATH}/stirling-pdf/logs:/logs
      - ${DATA_PATH}/stirling-pdf/pipeline:/pipeline
      - ${DATA_PATH}/stirling-pdf/customFiles:/customFiles
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8080/api/v1/info/status | grep -q 'UP' || curl -fL http://localhost:8080/ || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - proxy_net

networks:
  proxy_net:
    external: true

