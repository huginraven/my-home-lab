services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    init: true
    restart: ${RESTART_POLICY}
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - HOMEPAGE_ALLOWED_HOSTS=${HOMEPAGE_ALLOWED_HOSTS}
      - HOMEPAGE_VAR_CROWDSEC_USER=${HOMEPAGE_VAR_CROWDSEC_USER}
      - HOMEPAGE_VAR_CROWDSEC_PASS=${HOMEPAGE_VAR_CROWDSEC_PASS}
      - HOMEPAGE_VAR_DOCKHAND_KEY=${HOMEPAGE_VAR_DOCKHAND_KEY}
      - HOMEPAGE_VAR_JELLYFIN_KEY=${HOMEPAGE_VAR_JELLYFIN_KEY}
      - HOMEPAGE_VAR_SEERR_KEY=${HOMEPAGE_VAR_SEERR_KEY}
      - HOMEPAGE_VAR_SONARR_KEY=${HOMEPAGE_VAR_SONARR_KEY}
      - HOMEPAGE_VAR_RADARR_KEY=${HOMEPAGE_VAR_RADARR_KEY}
      - HOMEPAGE_VAR_BAZARR_KEY=${HOMEPAGE_VAR_BAZARR_KEY}
      - HOMEPAGE_VAR_PROWLARR_KEY=${HOMEPAGE_VAR_PROWLARR_KEY}
      - HOMEPAGE_VAR_DECYPHARR_USER=${HOMEPAGE_VAR_DECYPHARR_USER}
      - HOMEPAGE_VAR_DECYPHARR_PASS=${HOMEPAGE_VAR_DECYPHARR_PASS}
      - HOMEPAGE_VAR_MEALIE_KEY=${HOMEPAGE_VAR_MEALIE_KEY}
    volumes:
      - ${CONFIG_PATH}/homepage:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - proxy_net

networks:
  proxy_net:
    external: true
