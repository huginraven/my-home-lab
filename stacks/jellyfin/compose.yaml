services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:${JELLYFIN_TAG:-latest}
    container_name: jellyfin
    restart: ${RESTART_POLICY:-unless-stopped}
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: "${JELLYFIN_CPU_LIMIT:-3.5}"
          memory: ${JELLYFIN_MEM_LIMIT:-8G}
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
      - JELLYFIN_PublishedServerUrl=${JELLYFIN_PUBLISHED_SERVER_URL}
      # Prevents glibc arena memory bloat on Linux/ARM64 (matches official jellyfin/jellyfin image):
      - MALLOC_TRIM_THRESHOLD_=131072
    volumes:
      - ${CONFIG_PATH}/jellyfin:/config
      - ${DATA_PATH}/radarr/movies:/movies
      - ${DATA_PATH}/sonarr/tvseries:/tv
      - ${DATA_PATH}/decypharr/mnt:/mnt:rslave
    # Dedicated RAM-disk for FFmpeg transcoding/remuxing (zero SSD wear & protects small VPS disk):
    tmpfs:
      - /transcode:size=${JELLYFIN_TRANSCODE_SIZE:-4g},mode=1777
    # Optional Hardware Acceleration / GPU Transcoding (leave commented on Oracle Ampere CPU-only VPS):
    # devices:
    #   - /dev/dri:/dev/dri
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8096/health >/dev/null || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - proxy_net

networks:
  proxy_net:
    external: true
